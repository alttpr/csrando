name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  backend:
    name: Build .NET Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore ALttPR.sln
      - name: Verify formatting
        run: dotnet format whitespace ALttPR.sln --verify-no-changes --no-restore
      - name: Verify code style
        run: dotnet format style ALttPR.sln --verify-no-changes --no-restore
      - name: Build
        run: dotnet build ALttPR.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test ALttPR.sln --configuration Release --no-build

  frontend:
    name: Build/Test Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web
    steps:
      - uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: src/web/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test:run
      - name: Build
        env:
          # Provide minimal env to satisfy build-time expectations
          PRIVATE_DOTNET_API_BASE_URL: http://localhost:5000
          PUBLIC_SPRITES_BASE_URL: /sprites
          DATABASE_URL: sqlite:ci.db
        run: npm run build
