name: Publish Images

on:
  push:
    branches: [ main ]
    tags: [ 'v*', 'release-*' ]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER_LC: ${{ github.repository_owner }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        run: |
          OWNER_LC=$(echo "${{ github.repository_owner }}" | tr 'A-Z' 'a-z')
          REPO_NAME=$(basename "${{ github.repository }}")
          SHA_TAG=${GITHUB_SHA::12}
          IS_TAG=$([[ "${{ github.ref }}" == refs/tags/* ]] && echo true || echo false)
          REF_NAME="${GITHUB_REF_NAME}"

          FRONTEND_IMAGE="ghcr.io/${OWNER_LC}/rando-web-frontend"
          API_IMAGE="ghcr.io/${OWNER_LC}/csrando-api"

          FRONTEND_TAGS=("${FRONTEND_IMAGE}:${SHA_TAG}")
          API_TAGS=("${API_IMAGE}:${SHA_TAG}")

          if [[ "${{ github.ref }}" == refs/heads/main ]]; then
            FRONTEND_TAGS+=("${FRONTEND_IMAGE}:latest")
            API_TAGS+=("${API_IMAGE}:latest")
          fi
          if [[ "$IS_TAG" == true ]]; then
            SAFE_TAG=$(echo "$REF_NAME" | tr '/' '-')
            FRONTEND_TAGS+=("${FRONTEND_IMAGE}:${SAFE_TAG}")
            API_TAGS+=("${API_IMAGE}:${SAFE_TAG}")
          fi

          echo "frontend_tags=$(IFS=, ; echo "${FRONTEND_TAGS[*]}")" >> $GITHUB_OUTPUT
          echo "api_tags=$(IFS=, ; echo "${API_TAGS[*]}")" >> $GITHUB_OUTPUT

      - name: Build and push FRONTEND
        uses: docker/build-push-action@v6
        with:
          context: ./src/web
          file: ./src/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.frontend_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: ./src/Randomizer
          file: ./src/Randomizer/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.api_tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

