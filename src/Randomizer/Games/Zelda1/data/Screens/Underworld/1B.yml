name: Underworld Screen 1B
area: Underworld
screen: 0x1B
nodes:
  exits:
    - name: "Left edge"
      type: Scroll
      direction: Left

    - name: "Top edge"
      type: Scroll
      direction: Up

    - name: "Bottom edge"
      type: Scroll
      direction: Down

  regions:
    - name: "Middle"
      type: Region
      from: [0, 0]
      to: [11, 6]

    - name: "Top blocks"
      type: NoPlace
      from: [8, 0]
      to: [11, 2]

    - name: "Bottom blocks"
      type: NoPlace
      from: [8, 4]
      to: [11, 6]

  meta:
    - name: "Stairs"
      type: Stairs

edges:
  undirected:
    fixed:
      - ["Left edge", "Top edge"]
      - ["Left edge", "Bottom edge"]
      - ["Top edge", "Bottom edge"]
      - ["Left edge", "Middle"]
      - ["Left edge", "Stairs"]
