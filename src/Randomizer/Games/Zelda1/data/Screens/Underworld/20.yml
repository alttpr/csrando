name: Underworld Screen 20
area: Underworld
screen: 0x20
nodes:
  exits:
    - name: "Left edge - Entrance"
      type: Entrance
      direction: Left

    - name: "Left edge - Exit"
      type: Exit
      direction: Left

    - name: "Right edge - Entrance"
      type: Entrance
      direction: Right

    - name: "Right edge - Exit"
      type: Exit
      direction: Right

    - name: "Top edge - Entrance"
      type: Entrance
      direction: Up

    - name: "Top edge - Exit"
      type: Exit
      direction: Up

    - name: "Bottom edge - Entrance"
      type: Entrance
      direction: Down

    - name: "Bottom edge - Exit"
      type: Exit
      direction: Down

  regions:
    - name: "Left path"
      type: Region
      from: [0, 3]
      to: [5, 3]

    - name: "Right path"
      type: Region
      from: [7, 3]
      to: [11, 3]

    - name: "Top path"
      type: Region
      from: [5, 0]
      to: [6, 2]

    - name: "Bottom path"
      type: Region
      from: [5, 4]
      to: [6, 6]

  meta:
    - name: "Push block"
      type: Push

  blocks: [[5, 1], [5, 2], [5, 4], [5, 5], [6, 3]]

edges:
  undirected:
    fixed: []

  directed:
    fixed:
      # Each entrance leads into its own path region; from that region the push block
      # (centre) can be pushed away from you, opening the two perpendicular exits but not
      # the opposite edge. Routing through the region (rather than straight entrance->exit)
      # is what lets kill/clear logic, which hooks the room's regions, see the room as entered.
      - ["Left edge - Entrance", "Left path"]
      - ["Left path", "Top edge - Exit"]
      - ["Left path", "Bottom edge - Exit"]
      - ["Left path", "Push block"]

      - ["Right edge - Entrance", "Right path"]
      - ["Right path", "Top edge - Exit"]
      - ["Right path", "Bottom edge - Exit"]
      - ["Right path", "Push block"]

      - ["Top edge - Entrance", "Top path"]
      - ["Top path", "Left edge - Exit"]
      - ["Top path", "Right edge - Exit"]
      - ["Top path", "Push block"]

      - ["Bottom edge - Entrance", "Bottom path"]
      - ["Bottom path", "Left edge - Exit"]
      - ["Bottom path", "Right edge - Exit"]
      - ["Bottom path", "Push block"]
