name: Underworld Screen 07
area: Underworld
screen: 0x07
nodes:
  exits:
    - name: "Left edge"
      type: Scroll
      direction: Left

    - name: "Right edge"
      type: Scroll
      direction: Right

    - name: "Top edge"
      type: Scroll
      direction: Up

    - name: "Bottom edge"
      type: Scroll
      direction: Down

  regions:
    - name: "Middle"
      type: Region
      from: [0, 0]
      to: [11, 6]

    - name: "Top Blocks"
      type: NoPlace
      from: [1, 1]
      to: [10, 1]

    - name: "Middle Blocks"
      type: NoPlace
      from: [1, 3]
      to: [10, 3]

    - name: "Bottom Blocks"
      type: NoPlace
      from: [1, 5]
      to: [10, 5]

  meta:
    - name: "Push block"
      type: Push

edges:
  undirected:
    fixed:
      - ["Left edge", "Right edge"]
      - ["Left edge", "Top edge"]
      - ["Left edge", "Bottom edge"]
      - ["Right edge", "Top edge"]
      - ["Right edge", "Bottom edge"]
      - ["Top edge", "Bottom edge"]
      - ["Left edge", "Middle"]
      - ["Left edge", "Push block"]
