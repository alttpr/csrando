name: Underworld Screen 1D
area: Underworld
screen: 0x1D
nodes:
  exits:
    - name: "Left edge"
      type: Scroll
      direction: Left

    - name: "Right edge"
      type: Scroll
      direction: Right

    - name: "Top edge"
      type: Scroll
      direction: Up

    - name: "Bottom edge"
      type: Scroll
      direction: Down

  regions:
    - name: "Middle"
      type: Region
      from: [0, 0]
      to: [11, 6]

    - name: "Left blocks"
      type: NoPlace
      from: [2, 2]
      to: [3, 4]

    - name: "Right blocks"
      type: NoPlace
      from: [8, 2]
      to: [9, 4]

  meta:
    - name: "Push block"
      type: Push

edges:
  undirected:
    fixed:
      - ["Left edge", "Right edge"]
      - ["Left edge", "Top edge"]
      - ["Left edge", "Bottom edge"]
      - ["Right edge", "Top edge"]
      - ["Right edge", "Bottom edge"]
      - ["Top edge", "Bottom edge"]
      - ["Left edge", "Middle"]
      - ["Left edge", "Push block"]
