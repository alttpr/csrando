name: Underworld Screen 04
area: Underworld
screen: 0x04
nodes:
  exits:
    - name: "Left edge"
      type: Scroll
      direction: Left

    - name: "Right edge"
      type: Scroll
      direction: Right

    - name: "Top edge"
      type: Scroll
      direction: Up

    - name: "Bottom edge"
      type: Scroll
      direction: Down

  regions:
    - name: "Middle"
      type: Region
      from: [0, 0]
      to: [11, 6]

    - name: "Top Blocks"
      type: NoPlace
      from: [7, 0]
      to: [11, 2]

    - name: "Bottom Blocks"
      type: NoPlace
      from: [7, 4]
      to: [11, 6]

edges:
  undirected:
    fixed:
      - ["Left edge", "Right edge"]
      - ["Left edge", "Top edge"]
      - ["Left edge", "Bottom edge"]
      - ["Right edge", "Top edge"]
      - ["Right edge", "Bottom edge"]
      - ["Top edge", "Bottom edge"]
      - ["Left edge", "Middle"]
