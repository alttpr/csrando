name: Underworld Screen 0F
area: Underworld
screen: 0x0F
nodes:
  exits:
    - name: "Left edge"
      type: Scroll
      direction: Left

    - name: "Right edge"
      type: Scroll
      direction: Right

    - name: "Top edge"
      type: Scroll
      direction: Up

    - name: "Bottom edge"
      type: Scroll
      direction: Down

  regions:
    - name: "Middle path"
      type: Region
      from: [0, 3]
      to: [11, 3]

    - name: "Top side"
      type: Region
      from: [0, 0]
      to: [11, 1]

    - name: "Bottom side"
      type: Region
      from: [0, 5]
      to: [11, 6]

    - name: "Top block row"
      type: NoPlace
      from: [0, 2]
      to: [11, 2]

    - name: "Bottom block row"
      type: NoPlace
      from: [0, 4]
      to: [11, 4]

edges:
  undirected:
    fixed:
      - ["Left edge", "Middle path"]
      - ["Right edge", "Middle path"]
      - ["Top edge", "Top side"]
      - ["Bottom edge", "Bottom side"]
