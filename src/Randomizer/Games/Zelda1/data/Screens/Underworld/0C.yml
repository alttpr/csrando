name: Underworld Screen 0C
area: Underworld
screen: 0x0C
nodes:
  exits:
    - name: "Left edge"
      type: Scroll
      direction: Left

    - name: "Right edge"
      type: Scroll
      direction: Right

    - name: "Top edge"
      type: Scroll
      direction: Up

    - name: "Bottom edge"
      type: Scroll
      direction: Down

  regions:
    - name: "Middle"
      type: Region
      from: [0, 0]
      to: [11, 6]

    - name: "Left block column"
      type: NoPlace
      from: [1, 1]
      to: [1, 5]

    - name: "Middle block column"
      type: NoPlace
      from: [5, 1]
      to: [5, 5]

    - name: "Right block column"
      type: NoPlace
      from: [9, 1]
      to: [9, 5]

  meta:
    - name: "Push block"
      type: Push

  blocks: [[2, 4], [3, 4], [3, 3], [2, 6], [3, 0], [3, 1], [3, 2], [7, 1], [8, 1], [7, 5], [7, 6], [10, 2], [11, 2], [11, 5], [11, 6]]

edges:
  undirected:
    fixed:
      - ["Left edge", "Right edge"]
      - ["Left edge", "Top edge"]
      - ["Left edge", "Bottom edge"]
      - ["Right edge", "Top edge"]
      - ["Right edge", "Bottom edge"]
      - ["Top edge", "Bottom edge"]
      - ["Left edge", "Middle"]
      - ["Left edge", "Push block"]
