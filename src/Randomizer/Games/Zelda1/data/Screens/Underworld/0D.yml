name: Underworld Screen 0D
area: Underworld
screen: 0x0D
nodes:
  exits:
    - name: "Left edge"
      type: Scroll
      direction: Left

    - name: "Right edge"
      type: Scroll
      direction: Right

    - name: "Top edge"
      type: Scroll
      direction: Up

    - name: "Bottom edge"
      type: Scroll
      direction: Down

  regions:
    - name: "Middle"
      type: Region
      from: [0, 0]
      to: [11, 6]

  meta:
    - name: "Push block"
      type: Push

  blocks: [[1, 1], [3, 1], [5, 1], [6, 1], [8, 1], [10, 1],
           [1, 3], [3, 3], [5, 3], [6, 3], [8, 3], [10, 3],
           [1, 5], [3, 5], [5, 5], [6, 5], [8, 5], [10, 5]]

edges:
  undirected:
    fixed:
      - ["Left edge", "Right edge"]
      - ["Left edge", "Top edge"]
      - ["Left edge", "Bottom edge"]
      - ["Right edge", "Top edge"]
      - ["Right edge", "Bottom edge"]
      - ["Top edge", "Bottom edge"]
      - ["Left edge", "Middle"]
      - ["Left edge", "Push block"]
