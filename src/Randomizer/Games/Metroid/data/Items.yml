Bombs:
  bytes: [0x02, 0x00]
HiJump:
  bytes: [0x02, 0x01]
LongBeam:
  bytes: [0x02, 0x02]
ScrewAttack:
  bytes: [0x02, 0x03]
Morph:
  bytes: [0x02, 0x04]
Varia:
  bytes: [0x02, 0x05]
WaveBeam:
  bytes: [0x02, 0x06]
IceBeam:
  bytes: [0x02, 0x07]
EnergyTank:
  bytes: [0x02, 0x08]
  tier: medium
Missile:
  bytes: [0x02, 0x09]
  tier: minor
# Power-up entry with item id $FF, the engine's "empty slot" marker: the entry is
# parsed (so doors/extras on the screen still load) but nothing spawns or can be
# picked up. This is the blank-location encoding; never write it as a custom item.
Nothing:
  bytes: [0x02, 0xFF]
  tier: minor
