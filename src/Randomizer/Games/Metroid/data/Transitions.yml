# Directional rules for crossing directly between shuffled scroll screens.
# With no matching rule the transition is free, preserving the original behavior.
# Entries under requirements are alternatives (logical OR). Items grouped in an
# array must all be present (logical AND), so this:
#
#   requirements:
#     - [IceBeam, HiJump]
#     - Morph
#
# means (IceBeam AND HiJump) OR Morph.
# To prohibit a screen pairing completely, add a directional entry like this:
#
# - area: Brinstar
#   from:
#     screen: 0x00
#     direction: Up
#   to:
#     screen: 0x00
#     direction: Down
#   impossible: true
