name: "Geemer Item Pillars"
area: Brinstar
screen: 0x2A
scroll: Horizontal
# The item pillars/orb are drawn into this screen's room structure, so it always shows the
# orb -- keep it on item cells only (else a corridor placement renders a phantom empty orb).
structuralItem: true
nodes:
  exits:
      - name: "Left"
        type: Scroll
        direction: Left

      - name: "Right"
        type: Scroll
        direction: Right

  locations:
      - name: "Pillar Item Orb"
        type: Item
        position: [0x08, 0x06]

edges:
  undirected:
      fixed:
          - ["Left", "Pillar Item Orb"]
          - ["Right", "Pillar Item Orb"]
