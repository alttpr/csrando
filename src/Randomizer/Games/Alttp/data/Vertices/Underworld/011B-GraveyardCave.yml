rooms:
  - roomid: 0x011B
    nodes:
      regions:
        - name: "Graveyard Cave"
          inletid: 0x52
          connections:
            LiftPot:
              - "Graveyard Cave - Back"
          pots:
            - name: "Graveyard Cave - Pot 1"
              position: { x: 0x2e, y: 0x2c, z: 0x00 }
              sprite: "@BombRefill1"
            - name: "Graveyard Cave - Pot 2"
              position: { x: 0x30, y: 0x2c, z: 0x00 }
              sprite: "@Heart"
            - name: "Graveyard Cave - Pot 3"
              position: { x: 0x2e, y: 0x2e, z: 0x00 }
              sprite: "@BombRefill1"
            - name: "Graveyard Cave - Pot 4"
              position: { x: 0x30, y: 0x2e, z: 0x00 }
              sprite: "@Heart"
            - name: "Graveyard Cave - Pot 5"
              position: { x: 0x2e, y: 0x30, z: 0x00 }
              sprite: "@BombRefill1"
            - name: "Graveyard Cave - Pot 6"
              position: { x: 0x30, y: 0x30, z: 0x00 }
              sprite: "@Heart"
            - name: "Graveyard Cave - Pot 7"
              position: { x: 0x2e, y: 0x32, z: 0x00 }
              sprite: "@BombRefill1"
            - name: "Graveyard Cave - Pot 8"
              position: { x: 0x30, y: 0x32, z: 0x00 }
              sprite: "@Heart"

        - name: "Graveyard Cave - Back"
          connections:
            LiftPot:
              - "Graveyard Cave"
            UseBomb:
              - "Graveyard Cave - Hidden Room"

        - name: "Graveyard Cave - Hidden Room"
          connections:
            UseBomb:
              - "Graveyard Cave - Back"
          items:
            - name: "Graveyard Cave Item"
              addresses: [0x180004]
              type: "standing"
              itemset: ["lw"]
          mobs:
            # this is required to have the standing item appear
            - name: "Graveyard Cave - Hidden Room - Heart Piece"
              position: { x: 0x18, y: 0x9, z: 0x00 }
              sprite: "HeartPiece"
              allow:
                - "HeartPiece"
