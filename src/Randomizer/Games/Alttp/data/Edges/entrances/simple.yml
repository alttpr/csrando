  # Multi-Entrance Caves All entrances are grouped and randomized with each other.
  # Locations that are originally spanned by two-entrance caves (e.g. Kakariko
  # Elder’s House) will remain connected to each other via a two-entrance
  # cave. This does not include any of Light World Death Mountain.
  # NOTE: The order below matters between in and out, as it keeps connected caves together.
  - group: multi_entrance_caves
    overworld:
      - [["Grandma's House Right - In", "Grandma's House Right - Out"], ["Grandma's House Left - In", "Grandma's House Left - Out"]]
      - [["Brothers House Left - In", "Brothers House Left - Out"], ["Brothers House Right - In", "Brothers House Right - Out"]]
      - [["Dark Floating Island - In", "Dark Floating Island - Out"], ["East Dark Death Mountain Summit Rock - In", "East Dark Death Mountain Summit Rock - Out"]]
      - [["East Dark Death Mountain Summit Bunny - In", "East Dark Death Mountain Summit Bunny - Out"], ["East Dark Death Mountain Running Man Bunny - In", "East Dark Death Mountain Running Man Bunny - Out"]]
    underworld:
      - [["Grandma's House Right", "Grandma's House Right - Exit"], ["Grandma's House Left", "Grandma's House Left - Exit"]]
      - [["Brothers House Left", "Brothers House Left - Exit"], ["Brothers House Right", "Brothers House Right - Exit"]]
      - [["Hookshot Cave Corner", "Hookshot Cave Corner - Exit"], ["Hookshot Cave", "Hookshot Cave - Exit"]]
      - [["Super Bunny Exit", "Super Bunny Exit - Exit"], ["Super Bunny Entrance Bottom", "Super Bunny Entrance Bottom - Exit"]]
