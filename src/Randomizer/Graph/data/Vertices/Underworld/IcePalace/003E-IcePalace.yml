rooms:
  - roomid: 0x3E
    group: 13
    nodes:
      regions:
        # Players are expected to be able to take down the Stalfos Knights using only
        # pots and bombs when the EnemyShuffler is not enabled.
        - name: "Ice Palace - Stalfos Ambush"
          connections:
            IcePalaceStalfosAmbushTrophy|2:
              - "Ice Palace - Conveyor"
            ConfigWorldEnemyShuffleNone:
              - "Ice Palace - Stalfos Ambush - Pot Bypass"
          pots:
            - name: "Ice Palace - Conveyor - Pot 1"
              addresses: [0x01DFCA]
              position: { x: 0x30, y: 0x0c, z: 0x00 }
              item: "BombRefill1"
              itemset: ["ice", "inconsequential", "pot"]
              sprite: "@BombRefill1"
            - name: "Ice Palace - Conveyor - Pot 2"
              addresses: [0x01DFCD]
              position: { x: 0x32, y: 0x0c, z: 0x00 }
              item: "MagicRefillSmall"
              itemset: ["ice", "inconsequential", "pot"]
              sprite: "@MagicRefillSmall"
            - name: "Ice Palace - Conveyor - Pot 3"
              addresses: [0x01DFD0]
              position: { x: 0x2c, y: 0x14, z: 0x00 }
              item: "Heart"
              itemset: ["ice", "inconsequential", "pot"]
              sprite: "@Heart"
            - name: "Ice Palace - Conveyor - Pot 4"
              addresses: [0x01DFD3]
              position: { x: 0x2e, y: 0x14, z: 0x00 }
              item: "MagicRefillSmall"
              itemset: ["ice", "inconsequential", "pot"]
              sprite: "@MagicRefillSmall"
          mobs:
            - name: "Ice Palace - Stalfos Ambush - Stalfos Knight T"
              position: { x: 0x19, y: 0x04, z: 0x00 }
              sprite: "StalfosKnight"
              trophy: "IcePalaceStalfosAmbushTrophy"
            - name: "Ice Palace - Stalfos Ambush - Stalfos Knight B"
              position: { x: 0x16, y: 0x0b, z: 0x00 }
              sprite: "StalfosKnight"
              trophy: "IcePalaceStalfosAmbushTrophy"

        - name: "Ice Palace - Stalfos Ambush - Pot Bypass"
          connections:
            UseBomb:
              - "Ice Palace - Conveyor"

        - name: "Ice Palace - Conveyor"
          switch: true
          connections:
