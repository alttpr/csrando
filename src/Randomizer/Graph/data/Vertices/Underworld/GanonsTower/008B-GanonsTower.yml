rooms:
  - roomid: 0x8B
    group: 16
    nodes:
      regions:
        # TODO: Model the switch that is accessible from the south areas with bombs / boomerang / somaria
        # TODO: Verify pots in all this file
        - name: "Ganon's Tower - Whackamole"
          connections:
            fixed:
              - "Ganon's Tower - Torch Room"
            Hammer:
              - "Ganon's Tower - Bonk Pits - Middle"
          pots:
            - name: "Ganon's Tower - Map Room - Pot 3"
              # no match for position in base rom
              position: { x: 0x26, y: 0x18, z: 0x00 }
              itemset: ["gt", "inconsequential", "pot"]
            - name: "Ganon's Tower - Whackamole Pot BR"
              addresses: [0x01E28A]
              position: { x: 0x38, y: 0x18, z: 0x00 }
              item: "KeyA2"
              itemset: ["gt", "inconsequential", "pot"]
          mobs:
            - name: "Ganon's Tower - Map Room - Bumper"
              position: { x: 0x15, y: 0x07, z: 0x00 }
              sprite: "Bumper"
            - name: "Ganon's Tower - Map Room - Blue Bari"
              position: { x: 0x1a, y: 0x04, z: 0x00 }
              sprite: "BlueBari"

        - name: "Ganon's Tower - Bonk Pits - Top"
          connections:
            fixed:
              - "Ganon's Tower - DMs Room"
            Hookshot:
              - "Ganon's Tower - Bonk Pits - Islands"

        - name: "Ganon's Tower - Bonk Pits - Middle"
          connections:
            Hookshot:
              - "Ganon's Tower - Bonk Pits - Islands"
            PegasusBoots:
              - "Ganon's Tower - Bonk Pits - Islands"

        - name: "Ganon's Tower - Bonk Pits - Islands"
          connections:
            Hookshot:
              - "Ganon's Tower - Bonk Pits - Top"
              - "Ganon's Tower - Bonk Pits - Middle"
              - "Ganon's Tower - Bonk Pits - Bottom Upper"
            PegasusBoots:
              - "Ganon's Tower - Bonk Pits - Middle"
              - "Ganon's Tower - Bonk Pits - Bottom Upper"
          pots:
            - name: "Ganon's Tower - Map Room - Pot 1"
              # no match for position in base rom
              position: { x: 0x26, y: 0x28, z: 0x00 }
              itemset: ["gt", "inconsequential", "pot"]
              sprite: "@MagicRefillSmall"
          mobs:
            - name: "Ganon's Tower - Map Room - Spike Trap"
              position: { x: 0x03, y: 0x12, z: 0x00 }
              sprite: "SpikeTrap"
              deny:
                - "Statue"
                - "RollerVU"
                - "RollerVD"
                - "Beamos"
                - "AntifairyCircle"
                - "Bumper"

        - name: "Ganon's Tower - Bonk Pits - Bottom Upper"
          switch: true
          connections:
            Hookshot:
              - "Ganon's Tower - Bonk Pits - Islands"
            KeyA2:
              - "Ganon's Tower - Map Room"
            PegBlue:
              - "Ganon's Tower - Bonk Pits - Bottom Lower"
            PegOrange:
              - "Ganon's Tower - Bonk Pits - Bottom Upper - Orange Transition"
          pots:
            - name: "Ganon's Tower - Map Room - Pot 5"
              # no match for position in base rom
              position: { x: 0x0e, y: 0x2e, z: 0x00 }
              itemset: ["gt", "inconsequential", "pot"]
            - name: "Ganon's Tower - Map Room - Pot 6"
              # no match for position in base rom
              position: { x: 0x10, y: 0x2e, z: 0x00 }
              itemset: ["gt", "inconsequential", "pot"]
          mobs:
            - name: "Ganon's Tower - Map Room - Crystal Switch 1"
              position: { x: 0x04, y: 0x18, z: 0x00 }
              sprite: "CrystalSwitch"
              allow: ["CrystalSwitch"]
            - name: "Ganon's Tower - Map Room - Crystal Switch 2"
              position: { x: 0x0b, y: 0x18, z: 0x00 }
              sprite: "CrystalSwitch"
              allow: ["CrystalSwitch"]
            - name: "Ganon's Tower - Map Room - Stalfos"
              position: { x: 0x07, y: 0x18, z: 0x00 }
              sprite: "Stalfos"

        # Only accessible from the switch area, used to allow transitioning as orange
        # to the bottom area
        - name: "Ganon's Tower - Bonk Pits - Bottom Upper - Orange Transition"
          connections:
            UseBomb:
              - "Ganon's Tower - Bonk Pits - Bottom Lower"
            CaneOfSomaria:
              - "Ganon's Tower - Bonk Pits - Bottom Lower"

        - name: "Ganon's Tower - Bonk Pits - Bottom Lower"
          connections:
            fixed:
              - "Ganon's Tower - Twin Switches Top"
            PegBlue:
              - "Ganon's Tower - Bonk Pits - Bottom Upper"

        - name: "Ganon's Tower - Map Room"
          connections:
            KeyA2:
              - "Ganon's Tower - Bonk Pits - Bottom Upper"
          items:
            - name: "Ganon's Tower - Map Chest"
              type: "chest"
              addresses: [0xEAD3]
              itemset: ["gt"]
          pots:
            - name: "Ganon's Tower - Map Room - Pot 2"
              addresses: [0x01E290]
              position: { x: 0x26, y: 0x38, z: 0x00 }
              item: "Heart"
              itemset: ["gt", "inconsequential", "pot"]
              sprite: "@Heart"
            - name: "Ganon's Tower - Map Room - Pot 4"
              addresses: [0x01E28D]
              position: { x: 0x10, y: 0x12, z: 0x00 }
              item: "MagicRefillSmall"
              itemset: ["gt", "inconsequential", "pot"]
          mobs:
            - name: "Ganon's Tower - Map Room - Fire Bar (Clockwise)"
              position: { x: 0x18, y: 0x18, z: 0x00 }
              sprite: "FireBarCW"
              deny:
                - "Beamos"
                - "AntifairyCircle"
                - "BigSpikeTrap"
                - "Bumper"
            - name: "Ganon's Tower - Map Room - Fire Bar (Counterclockwise)"
              position: { x: 0x18, y: 0x18, z: 0x00 }
              sprite: "FireBarCCW"
              deny:
                - "Beamos"
                - "AntifairyCircle"
                - "BigSpikeTrap"
                - "Bumper"
