# As in Simple except all non-dungeon entrances (including all single-entrance
# caves, all multi-entrance caves, and all of Light World Death Mountain) are
# grouped together and randomized with each other. This includes the entrance to
# Death Mountain.
fixed:
  - ["Bumper Cave Entrance Bottom - In", "Old Man Cave Ledge"]
  - ["Old Man Cave Ledge - Exit", "Bumper Cave Entrance Bottom - Out"]
connections:
  # Caves All entrances are grouped and randomized with each other.
  - group: caves
    in:
      - [["Link's House - In", "Bomb Shoppe Lobby - Exit"]]
      - [["Bomb Shoppe - Shoppe - In", "Link's House - Bedroom - Exit"]]
      - [["West Death Mountain Big Fairy - In", "Old Man Maze - Exit"]]
      - [["Death Mountain Foot Cave Entrance - In", "Bumper Cave Bottom - Exit"]]
      - [["Death Mountain Foot Descent Ledge - In", "Bumper Cave Top Exit - Exit"]]
    out:
      - [["Bomb Shoppe Lobby", "Link's House - Out"]]
      - [["Link's House - Bedroom", "Bomb Shoppe - Shoppe - Out"]]
      - [["Old Man Maze", "West Death Mountain Big Fairy - Out"]]
      - [["Bumper Cave Bottom", "Death Mountain Foot Cave Entrance - Out"]]
      - [["Bumper Cave Top Exit", "Death Mountain Foot Descent Ledge - Out"]]
