# This setting uses the highest number of entrance type groupings. This
# restricts how thoroughly different entrances are randomized with the intention
# of keeping things simple.
#
# Single-Entrance Caves All entrances are grouped and randomized with each
# other. This does not include any of Light World Death Mountain. Example:
# houses.
connections:
  - # Single-Entrance Dungeons
    # All entrances are grouped and randomized with each other. This includes the
    # final section of Skull Woods (leading to the boss) but does not include any
    # other Skull Woods entrances.
    in:
      - ["Eastern Palace - In", "Eastern Palace - Entrance - Exit"]
      - ["Tower Of Hera - Entrance - In", "Tower Of Hera - Entrance - Exit"]
      - ["Palace of Darkness Door - In", "Palace of Darkness - Lobby - Exit"]
      - ["Swamp Palace - In", "Swamp Palace - Entrance - Exit"]
      - ["Skull Woods Back - In", "Skull Woods - Bridge Room - Exit"]
      - ["Thieves Town - In", "Thieves' Town - Grand Room SW - Exit"]
      - ["Ice Palace - In", "Ice Palace - Entrance - Exit"]
      - ["Mire - In", "Misery Mire - Entrance - Exit"]
      - ["Ganon's Tower - In", "Ganon's Tower - Lobby - Exit"]
    out:
      - ["Eastern Palace - Entrance", "Eastern Palace - Out"]
      - ["Tower Of Hera - Entrance", "Tower Of Hera - Entrance - Out"]
      - ["Palace of Darkness - Lobby", "Palace of Darkness Door - Out"]
      - ["Swamp Palace - Entrance", "Swamp Palace - Out"]
      - ["Skull Woods - Bridge Room", "Skull Woods Back - Out"]
      - ["Thieves' Town - Grand Room SW", "Thieves Town - Out"]
      - ["Ice Palace - Entrance", "Ice Palace - Out"]
      - ["Misery Mire - Entrance", "Mire - Out"]
      - ["Ganon's Tower - Lobby", "Ganon's Tower - Out"]

  - # Skull Woods (excluding final dungeon entrance) All entrances (including all of
    # the holes) remain confined to the Skull Woods overworld region and are
    # randomized with each other. Skull-entrances are randomized with
    # skull-entrances; and holes are randomized with holes.
    in:
      - ["Skull Woods Second Section West - In", "Skull Woods - Bumper Buddy - Exit"]
      - ["Skull Woods Second Section East - In", "Skull Woods - Statue Puzzle - Exit"]
      - ["Skull Woods First Section - In", "Skull Woods - Main Entrance - Exit"]
    out:
      - ["Skull Woods - Bumper Buddy", "Skull Woods Second Section West - Out"]
      - ["Skull Woods - Statue Puzzle", "Skull Woods Second Section East - Out"]
      - ["Skull Woods - Main Entrance", "Skull Woods First Section - Out"]
  - # Skull Woods holes
    in:
      - ["Skull Woods Back - Hole"]
      - ["Skull Woods First Section North - Hole"]
      - ["Skull Woods First Section East - Hole"]
      - ["Skull Woods First Section West - Hole"]
    out:
      - ["Skull Woods - Dumb Switches Top"]
      - ["Skull Woods - Hourglass Top"]
      - ["Skull Woods - Pinball Room"]
      - ["Skull Woods - Firebar Pits"]

  - # Multi-Entrance Dungeons (excluding Skull Woods)
    # Each of the 4 entrances of Hyrule Castle, Desert Palace and Turtle Rock
    # remain grouped together. Each group of 4 are randomized with each other
    # using a static mapping. For example if Hyrule Castle and Desert Palace are
    # randomized with each other, the main entrance of Desert Palace will lead to
    # the main entrance of Hyrule Castle, the left entrance of Desert Palace will
    # lead to the left entrance of Hyrule Castle, and so on. However Hyrule Castle
    # is not randomized on Standard World State.
    in:
      - # Hyrule Castle
        - "Hyrule Castle - Main Entrance - In"
        - "Hyrule Castle - Lobby - Exit"
        - "Hyrule Castle - West Entrance - In"
        - "Hyrule Castle - West - Exit"
        - "Hyrule Castle - East Entrance - In"
        - "Hyrule Castle - East - Exit"
        - "Hyrule Castle - Agahnim's Tower Entrance - In"
        - "Agahnims Tower - Entrance - Exit"
      - # Desert Palace
        - "Desert Palace - Lobby - In"
        - "Desert Palace - Main Room - Center - Exit"
        - "Desert Palace - West - In"
        - "Desert Palace - West - Exit"
        - "Desert Palace - East - In"
        - "Desert Palace - East - Exit"
        - "Desert Palace - Back - In"
        - "Desert Palace - Beemos 2 - Exit"
      - # Turtle Rock
        - "Turtle Rock - In"
        - "Turtle Rock - Entrance - Exit"
        - "Turtle Rock Outside Bridge East - In"
        - "Turtle Rock - Big Chest Entrance - Exit"
        - "Turtle Rock Outside Rest Area - In"
        - "Turtle Rock - Eye Bridge - Bomb Door - Exit"
        - "Turtle Rock Outside Bridge West - In"
        - "Turtle Rock - Laser Entrance - Exit"
    out:
      - # Hyrule Castle
        - "Hyrule Castle - Lobby"
        - "Hyrule Castle - Main Entrance - Out"
        - "Hyrule Castle - West"
        - "Hyrule Castle - West Entrance - Out"
        - "Hyrule Castle - East"
        - "Hyrule Castle - East Entrance - Out"
        - "Agahnims Tower - Entrance"
        - "Hyrule Castle - Agahnim's Tower Entrance - Out"
      - # Desert Palace
        - "Desert Palace - Main Room - Center"
        - "Desert Palace - Lobby - Out"
        - "Desert Palace - West"
        - "Desert Palace - West - Out"
        - "Desert Palace - East"
        - "Desert Palace - East - Out"
        - "Desert Palace - Beemos 2"
        - "Desert Palace - Back - Out"
      - # Turtle Rock
        - "Turtle Rock - Entrance"
        - "Turtle Rock - Out"
        - "Turtle Rock - Big Chest Entrance"
        - "Turtle Rock Outside Bridge East - Out"
        - "Turtle Rock - Eye Bridge - Bomb Door"
        - "Turtle Rock Outside Rest Area - Out"
        - "Turtle Rock - Laser Entrance"
        - "Turtle Rock Outside Bridge West - Out"

  - # Light World Death Mountain All entrances remain confined to the Light World
    # Death Mountain overworld region and are randomized with each other. Note that
    # the entrance to Death Mountain (via the cave where the Old Man is lost) is
    # also not randomized.
    in:
      # east
      - ["Spectacle Rock Cave Top - In", "Spectacle Rock Cave Top - Exit"]
      - ["Spectacle Rock Cave Middle - In", "Spectacle Rock Cave Middle - Exit"]
      - ["Spectacle Rock Cave Exit - In", "Spectacle Rock Cave Exit - Exit"]
      - ["Old Man Home - In", "Old Man Home - Exit"]
      - ["Old Man Home Circle - In", "Old Man Home Circle - Exit"]
      - ["Old Man Maze - In", "Old Man Maze - Exit"]
      # west
      - ["Fairy Ascension Cave - Pits Right - In", "Fairy Ascension Cave - Pits Right - Exit"]
      - ["Mimic Cave Entrance - In", "Mimic Cave Entrance - Exit"]
      - ["Paradox Cave - Middle - In", "Paradox Cave - Middle - Exit"]
      - ["Paradox Cave - Bottom Entrance - In", "Paradox Cave - Bottom Entrance - Exit"]
      - ["Spiral Cave Exit - In", "Spiral Cave Exit - Exit"]
      - ["Fairy Pond Cave Entrance - In", "Fairy Pond Cave Entrance - Exit"]
      - ["Fairy Ascension Cave - Bottom - In", "Fairy Ascension Cave - Bottom - Exit"]
      - ["Spiral Cave Top - In", "Spiral Cave Top - Exit"]
      - ["Paradox Cave - Top - In", "Paradox Cave - Top - Exit"]
    out:
      # east
      - ["Spectacle Rock Cave Top", "Spectacle Rock Cave Top - Out"]
      - ["Spectacle Rock Cave Middle", "Spectacle Rock Cave Middle - Out"]
      - ["Spectacle Rock Cave Exit", "Spectacle Rock Cave Exit - Out"]
      - ["Old Man Home", "Old Man Home - Out"]
      - ["Old Man Home Circle", "Old Man Home Circle - Out"]
      - ["Old Man Maze", "Old Man Maze - Out"]
      # west
      - ["Fairy Ascension Cave - Pits Right", "Fairy Ascension Cave - Pits Right - Out"]
      - ["Mimic Cave Entrance", "Mimic Cave Entrance - Out"]
      - ["Paradox Cave - Middle", "Paradox Cave - Middle - Out"]
      - ["Paradox Cave - Bottom Entrance", "Paradox Cave - Bottom Entrance - Out"]
      - ["Spiral Cave Exit", "Spiral Cave Exit - Out"]
      - ["Fairy Pond Cave Entrance", "Fairy Pond Cave Entrance - Out"]
      - ["Fairy Ascension Cave - Bottom", "Fairy Ascension Cave - Bottom - Out"]
      - ["Spiral Cave Top", "Spiral Cave Top - Out"]
      - ["Paradox Cave - Top", "Paradox Cave - Top - Out"]

  - # Overworld Holes (excluding those in Skull Woods) All holes are grouped and
    # randomized with each other. Holes and their associated cave entrance remain
    # paired together. For example falling in a hole and exiting will take you to
    # the overworld cave associated with that hole, regardless of which interior
    # rooms the hole led to.
    in:
      - ["Thief Hideout - Hole", "Thief Hideout - In", "Thief Hideout - Exit"]
      - ["Sewers - Block Puzzle - Hole", "Sanctuary Hall - In", "Sanctuary Hall - Exit"]
      - ["Lumberjacks Tree - Hole", "Lumberjacks Cave - In", "Lumberjacks Cave - Exit"]
      - ["Drop Great Fairy - Hole", "Drop Great Fairy - In", "Drop Great Fairy Exit - Exit"]
      - ["Kakariko Well - Hole", "Kakariko Well - In", "Kakariko Well - Exit"]
      - ["Secret Passage Uncle - Hole", "Secret Passage Stairs - In", "Secret Passage Stairs - Exit"]
      - ["Magic Bat - Hole", "Magic Bat - In", "Magic Bat Left - Exit"]
      - ["Pyramid - Hole", "Pyramid Ganon Fail - In", "Ganon's Drop - Exit"]
    out:
      - ["Thief Hideout - Ledge", "Thief Hideout", "Thief Hideout - Out"]
      - ["Sewers - Block Puzzle", "Sanctuary Hall", "Sanctuary Hall - Out"]
      - ["Lumberjacks Cave Fairies", "Lumberjacks Cave", "Lumberjacks Cave - Out"]
      - ["Drop Great Fairy Antechamber", "Drop Great Fairy Exit", "Drop Great Fairy - Out"]
      - ["Kakariko Well", "Kakariko Well - Water", "Kakariko Well - Out"]
      - ["Secret Passage Uncle", "Secret Passage Stairs", "Secret Passage Stairs - Out"]
      - ["Magic Bat Entry", "Magic Bat Left", "Magic Bat - Out"]
      - ["Ganon's Room", "Ganon's Drop", "Pyramid Ganon Fail - Out"]

# Multi-Entrance Caves All entrances are grouped and randomized with each other.
# Locations that are originally spanned by two-entrance caves (e.g. Kakariko
# Elder’s House) will remain connected to each other via a two-entrance
# cave. This does not include any of Light World Death Mountain.
multi:
  in:
    - ["Grandma's House Right - In", "Grandma's House Right - Exit", "Grandma's House Left - In", "Grandma's House Left - Exit"]
    - ["Brothers House Left - In", "Brothers House Left - Exit", "Brothers House Right - In", "Brothers House Right - Exit"]
    - ["Ice Cave - West - In", "Ice Cave - West - Exit", "Ice Cave - East - In", "Ice Cave - East - Exit"]
    - ["Dark Floating Island - In", "Hookshot Cave Corner - Exit", "East Dark Death Mountain Summit Rock - In", "Hookshot Cave - Exit"]
    - ["East Dark Death Mountain Summit Bunny - In", "Super Bunny Exit - Exit", "East Dark Death Mountain Running Man Bunny - In", "Super Bunny Entrance Bottom - Exit"]
  out:
    - ["Grandma's House Right", "Grandma's House Right - Out", "Grandma's House Left", "Grandma's House Left - Out"]
    - ["Brothers House Left", "Brothers House Left - Out", "Brothers House Right", "Brothers House Right - Out"]
    - ["Ice Cave - West", "Ice Cave - West - Out", "Ice Cave - East", "Ice Cave - East - Out"]
    - ["Hookshot Cave Corner", "Dark Floating Island - Out", "Hookshot Cave", "East Dark Death Mountain Summit Rock - Out"]
    - ["Super Bunny Exit", "East Dark Death Mountain Summit Bunny - Out", "Super Bunny Entrance Bottom", "East Dark Death Mountain Running Man Bunny - Out"]
