# As in Simple except all non-dungeon entrances (including all single-entrance
# caves, all multi-entrance caves, and all of Light World Death Mountain) are
# grouped together and randomized with each other. This includes the entrance to
# Death Mountain.
fixed:
  - ["Death Mountain Foot Cave Entrance - In", "Old Man Cave Ledge"]
  - ["Old Man Cave Ledge - Exit", "Death Mountain Foot Cave Entrance - Out"]
  - ["Link's House - In", "Link's House - Bedroom"]
  - ["Link's House - Bedroom - Exit", "Link's House - Out"]
connections:
  # Caves All entrances are grouped and randomized with each other.
  - group: caves
    in:
      - [["Bomb Shoppe - Shoppe - In", "Bomb Shoppe Lobby - Exit"]]
      - [["West Death Mountain Big Fairy - In", "Death Mountain Big Fairy - Exit"]]
      - [["Bumper Cave Entrance Bottom - In", "Bumper Cave Bottom - Exit"]]
      - [["Bumper Cave Ledge Top - In", "Bumper Cave Top Exit - Exit"]]
      - [["Death Mountain Descent - In", "Death Mountain Descent Cave Right - Exit"]]
      - [["Death Mountain Foot Descent Ledge - In", "Death Mountain Descent Cave Left - Exit"]]
    out:
      - [["Bomb Shoppe Lobby", "Bomb Shoppe - Shoppe - Out"]]
      - [["Death Mountain Big Fairy", "West Death Mountain Big Fairy - Out"]]
      - [["Bumper Cave Bottom", "Bumper Cave Entrance Bottom - Out"]]
      - [["Bumper Cave Top Exit", "Bumper Cave Ledge Top - Out"]]
      - [["Death Mountain Descent Cave Right", "Death Mountain Descent - Out"]]
      - [["Death Mountain Descent Cave Left", "Death Mountain Foot Descent Ledge - Out"]]
