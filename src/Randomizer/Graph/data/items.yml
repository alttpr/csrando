ShopKey:
  bytes: [0xAF]
  type: SmallKey
# these bytes correspond to the addresses held by type: "prize" items.
# all of them are ROM/file addresses, not SNES adresses.
# they map to the following base rom locations (tables.asm unless otherwise noted):
# - CrystalPendantFlags
# - WorldMapIcon_tile (2 bytes)
# - WorldMapIcon_tile
# - CrystalPendantFlags_2
# - CrystalNumberTable
# - DungeonPrizeReceiptID
Crystal1:
  bytes: [0x02, 0x34, 0x64, 0x40, 0x7F, 0x20]
Crystal2:
  bytes: [0x10, 0x34, 0x64, 0x40, 0x79, 0x20]
Crystal3:
  bytes: [0x40, 0x34, 0x64, 0x40, 0x6C, 0x20]
Crystal4:
  bytes: [0x20, 0x34, 0x64, 0x40, 0x6D, 0x20]
Crystal5:
  bytes: [0x04, 0x32, 0x64, 0x40, 0x6E, 0x20]
Crystal6:
  bytes: [0x01, 0x32, 0x64, 0x40, 0x6F, 0x20]
Crystal7:
  bytes: [0x08, 0x34, 0x64, 0x40, 0x7C, 0x20]
